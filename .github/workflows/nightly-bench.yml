name: Nightly Benchmarks

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: nightly-bench
  cancel-in-progress: false

env:
  GCP_ZONE: ${{ vars.GCP_ZONE || 'us-east1-b' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout trunk (Rust code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: trunk
          path: alyze

      - name: Checkout gh-pages (bench scripts + results)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: gh-pages
          path: gh-pages

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run benchmarks
        run: |
          chmod +x gh-pages/benches/*.sh
          NAPKIN_GCP_ZONE=$GCP_ZONE REPO_DIR=$GITHUB_WORKSPACE/alyze \
            bash gh-pages/benches/bench-fleet-ci.sh

      - name: Publish results
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          cd gh-pages

          mkdir -p data
          tail -n +2 $GITHUB_WORKSPACE/alyze/data/results.csv > "data/${TODAY}.csv"
          make publish

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "bench: ${TODAY} results"
          git push
