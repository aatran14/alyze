name: Nightly Benchmarks

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: nightly-bench
  cancel-in-progress: false

env:
  GCP_ZONE: ${{ vars.GCP_ZONE || 'us-east1-b' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run benchmarks
        run: |
          chmod +x benches/bench-fleet-ci.sh benches/bench-worker.sh
          NAPKIN_GCP_ZONE=$GCP_ZONE bash benches/bench-fleet-ci.sh

      - name: Checkout gh-pages
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish results to gh-pages
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          mkdir -p gh-pages/data
          tail -n +2 data/results.csv > "gh-pages/data/${TODAY}.csv"

          # Rebuild combined CSV from all daily files
          echo "benchmark,machine,throughput_mibs,timestamp,commit" > gh-pages/data/data.csv
          for f in gh-pages/data/2*.csv; do
            cat "$f" >> gh-pages/data/data.csv
          done

          # Copy chart page from trunk, rewrite fetch path
          sed 's|data/results\.csv|data/data.csv|' index.html > gh-pages/index.html
          cp style.css gh-pages/style.css

      - name: Commit and push
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html style.css
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "bench: $(date -u +%Y-%m-%d) results"
          git push
